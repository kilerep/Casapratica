services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: casapratica
      POSTGRES_USER: casapratica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casapratica -d casapratica"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  oauth-tunnel:
    image: ngrok/ngrok:3-alpine
    profiles: ["oauth-tunnel"]
    restart: unless-stopped
    command: ["http", "http://host.docker.internal:3001", "--url", "https://${NGROK_DOMAIN:?configure NGROK_DOMAIN}", "--inspect=false", "--log", "stdout", "--log-format", "json"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?configure NGROK_AUTHTOKEN outside Git}
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  postgres-data:
  redis-data:
